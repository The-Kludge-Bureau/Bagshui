name: Automatic Release on X.Y.Z Tag
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
jobs:
  release:
    # Override repository workflow security settings to ensure git-release can create the new release.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Zip
        uses: thedoctor0/zip-release@0.7.5
        with:
          type: "zip"
          filename: "Bagshui.zip"
          exclusions: "*.git* .vscode .editorconfig"

      - name: Extract Release Notes
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          awk -v version="$VERSION" '
            $0 ~ "^## " version "([[:space:]]|$)" {
              found = 1
              next
            }
            found && /^## / {
              exit
            }
            found {
              print
            }
          ' Changelog.md > RELEASE_NOTES.md

          if [ ! -s RELEASE_NOTES.md ]; then
            printf 'No changelog entry found for %s\n' "$VERSION" >&2
            exit 1
          fi

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" Bagshui.zip \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag
